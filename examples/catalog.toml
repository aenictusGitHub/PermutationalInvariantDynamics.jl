schema_version = 1

# Complete user-facing example inventory. Documentation galleries and
# consistency tests consume this file; every runnable script has one record.
#
# Runtime classes describe a default root-environment run after package
# precompilation:
#   instant  < 10 s, short < 1 min, medium < 5 min, long >= 5 min.

[[example]]
id = "getting-started"
title = "From a PI model to dynamics and a stationary state"
script = "examples/getting_started.jl"
guide = "examples/getting_started.md"
difficulty = "beginner"
tasks = ["dynamics", "steady-state", "observables", "convergence"]
runtime_class = "short"
stochastic = false
optional_dependencies = ["CairoMakie"]
citation = "PermutationalInvariantDynamics.jl model-to-solution tutorial"
model_recipe = "Models.driven_qubits"
expected_outputs = ["docs/src/assets/example_figures/getting_started.png"]

