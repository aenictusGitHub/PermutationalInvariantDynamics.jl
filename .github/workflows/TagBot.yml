name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: JuliaRegistries/TagBot@e4c81aa138ef4179bddea165bb4a9680c223aca4 # v1.25.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The repository-scoped deploy key lets a tag push trigger the
          # documentation workflow. Do not replace it with an account-wide PAT.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
