name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
        with:
          delete-old-caches: 'false'
      - name: Test browser model code generator
        run: |
          node docs/test/model_code_generator_tests.js
          node --check docs/src/assets/model_code_generator_ui.js
      - name: Install documentation dependencies
        run: >-
          julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd());
          Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs --color=yes docs/make.jl

  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
        with:
          delete-old-caches: 'false'
      - name: Test browser model code generator
        run: |
          node docs/test/model_code_generator_tests.js
          node --check docs/src/assets/model_code_generator_ui.js
      - name: Install documentation dependencies
        run: >-
          julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd());
          Pkg.instantiate()'
      - name: Build and deploy documentation
        run: julia --project=docs --color=yes docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
