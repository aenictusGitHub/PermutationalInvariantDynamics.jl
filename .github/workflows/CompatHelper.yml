name: CompatHelper

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compathelper
  cancel-in-progress: false

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1'
      - name: Add the General registry via Git
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: Install CompatHelper
        run: |
          import Pkg
          Pkg.add(; name="CompatHelper",
                  uuid="aa819f21-2bde-4658-8897-bab36330d9b7",
                  version="3")
        shell: julia --color=yes {0}
      - name: Run CompatHelper
        run: |
          import CompatHelper
          CompatHelper.main()
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuse the repository-scoped Documenter deploy key so CompatHelper's
          # branch push triggers CI on the pull request it creates.
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
