name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
            coverage: false
          - os: ubuntu-latest
            julia-version: '1'
            coverage: true
          - os: macos-latest
            julia-version: '1.10'
            coverage: false
          - os: macos-latest
            julia-version: '1'
            coverage: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - name: Process coverage
        if: matrix.coverage
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        if: >-
          matrix.coverage &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          use_oidc: true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce tracked-manifest policy
        shell: bash
        run: |
          tracked_manifests="$(git ls-files ':(glob)**/Manifest.toml')"
          if [[ "${tracked_manifests}" != "docs/Manifest.toml" ]]; then
            echo "Only docs/Manifest.toml may be tracked; found:"
            echo "${tracked_manifests}"
            exit 1
          fi
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate quality environment
        run: >-
          julia --project=quality -e 'using Pkg; Pkg.develop(path=pwd());
          Pkg.instantiate()'
      - name: Aqua and JET gates
        run: julia --project=quality quality/quality.jl

  optional-extensions:
    name: optional extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate optional-extension environment
        run: >-
          julia --project=test/optional -e 'using Pkg;
          Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Clarabel, Makie, QuantumCumulants, JLD2, and HDF5 smoke tests
        run: julia --project=test/optional test/optional/runtests.jl

  threaded:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate benchmark environment
        run: >-
          julia --startup-file=no --project=benchmark -e 'using Pkg;
          Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Thread-safety and allocation gates
        run: >-
          julia --startup-file=no --project=benchmark
          benchmark/performance_regression.jl
