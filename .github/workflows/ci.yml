name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_readiness:
        description: Require finalized, dated release metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
      - name: Validate release-candidate metadata and repository hygiene
        if: >-
          ${{ !startsWith(github.ref, 'refs/tags/') &&
          !(github.event_name == 'workflow_dispatch' &&
          inputs.release_readiness) }}
        run: >-
          julia --startup-file=no scripts/release_gate.jl
          --require-clean
      - name: Validate finalized release metadata before registration
        if: >-
          ${{ !startsWith(github.ref, 'refs/tags/') &&
          github.event_name == 'workflow_dispatch' &&
          inputs.release_readiness }}
        run: >-
          julia --startup-file=no scripts/release_gate.jl
          --require-clean --require-released
      - name: Validate immutable release tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: >-
          julia --startup-file=no scripts/release_gate.jl
          --require-clean --require-released
          --tag-ref "${{ github.ref }}"

  licensing:
    name: REUSE licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate machine-readable copyright and licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
            coverage: false
          - os: ubuntu-latest
            julia-version: '1'
            coverage: true
          - os: macos-latest
            julia-version: '1.10'
            coverage: false
          - os: macos-latest
            julia-version: '1'
            coverage: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: 'false'
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
        with:
          coverage: ${{ matrix.coverage }}
      - name: Process coverage
        if: matrix.coverage
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
      - name: Upload coverage to Codecov
        if: >-
          matrix.coverage &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          use_oidc: true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce tracked-manifest policy
        shell: bash
        run: |
          tracked_manifests="$(git ls-files ':(glob)**/Manifest.toml')"
          if [[ "${tracked_manifests}" != "docs/Manifest.toml" ]]; then
            echo "Only docs/Manifest.toml may be tracked; found:"
            echo "${tracked_manifests}"
            exit 1
          fi
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate quality environment
        run: >-
          julia --project=quality -e 'using Pkg; Pkg.develop(path=pwd());
          Pkg.instantiate()'
      - name: Aqua and JET gates
        run: julia --project=quality quality/quality.jl

  optional-extensions:
    name: optional extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate optional-extension environment
        run: >-
          julia --project=test/optional -e 'using Pkg;
          Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Optional integration smoke tests
        run: julia --project=test/optional test/optional/runtests.jl

  executable-examples:
    name: executable examples ${{ matrix.shard }}
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 1
      PID_EXAMPLE_QUICK: 1
      PID_EXAMPLE_RENDER: 0
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate core environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run deterministic numerical examples
        run: >-
          julia --startup-file=no --project=.
          test/run_quick_examples.jl --shard "${{ matrix.shard }}"

  threaded:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate benchmark environment
        run: >-
          julia --startup-file=no --project=benchmark -e 'using Pkg;
          Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Thread-safety and allocation gates
        run: >-
          julia --startup-file=no --project=benchmark
          benchmark/performance_regression.jl
      - name: Productization benchmark harness smoke tests
        run: >-
          julia --startup-file=no --project=benchmark
          benchmark/test_productization_harnesses.jl
